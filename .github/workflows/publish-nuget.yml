name: 发布 NuGet 包

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 构建、测试并发布
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

    steps:
      - name: 检出标签
        uses: actions/checkout@v6

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: 从标签解析包版本
        id: version
        shell: bash
        run: |
          set -euo pipefail

          package_version="${GITHUB_REF_NAME#v}"
          semver_pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'

          if [[ "$package_version" == "$GITHUB_REF_NAME" || ! "$package_version" =~ $semver_pattern ]]; then
            echo "::error::标签必须使用 v<SemVer> 格式，例如 v0.1.0 或 v0.2.0-preview.1。"
            exit 1
          fi

          echo "value=$package_version" >> "$GITHUB_OUTPUT"

      - name: 锁定还原
        run: dotnet restore W.EntityFrameworkCore.Dameng.slnx --locked-mode --disable-parallel

      - name: Release 构建
        run: dotnet build W.EntityFrameworkCore.Dameng.slnx --configuration Release --no-restore

      - name: 运行单元测试
        run: >-
          dotnet test
          test/W.EntityFrameworkCore.Dameng.Tests/W.EntityFrameworkCore.Dameng.Tests.csproj
          --configuration Release
          --no-build
          --no-restore

      - name: 打包
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: >-
          dotnet pack
          src/W.EntityFrameworkCore.Dameng/W.EntityFrameworkCore.Dameng.csproj
          --configuration Release
          --no-build
          --no-restore
          --output "${{ runner.temp }}/packages"
          -p:PackageVersion="$PACKAGE_VERSION"

      - name: 发布到 NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t packages < <(
            find "${{ runner.temp }}/packages" \
              -maxdepth 1 \
              -type f \
              -name '*.nupkg' \
              ! -name '*.snupkg' \
              -print
          )

          if (( ${#packages[@]} != 1 )); then
            echo "::error::预期生成 1 个 NuGet 包，实际找到 ${#packages[@]} 个。"
            exit 1
          fi

          dotnet nuget push "${packages[0]}" \
            --api-key "$NUGET_API_KEY" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

  release:
    name: 创建 GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: 创建 Release Notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $TAG_NAME 已存在，无需重复创建。"
            exit 0
          fi

          package_version="${TAG_NAME#v}"
          release_args=(
            "$TAG_NAME"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --generate-notes
            --title "$TAG_NAME"
          )

          if [[ "$package_version" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
